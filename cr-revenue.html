<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CR Revenue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #f0f2f7; min-height: 100vh; color: #111; }

  /* Login */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-card { background: #fff; border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
  .login-logo { font-size: 28px; font-weight: 800; color: #0d2345; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
  .login-label { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 6px; }
  .login-input { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; margin-bottom: 14px; }
  .login-input:focus { border-color: #1e40af; }
  .login-btn { width: 100%; background: #0d2345; color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
  .login-btn:hover { background: #1e40af; }
  .login-error { font-size: 13px; color: #dc2626; margin-top: 10px; min-height: 20px; }

  /* App shell */
  #app { display: none; min-height: 100vh; padding: 0 0 80px; }
  .app-header { background: #0d2345; padding: 20px 24px 16px; display: flex; align-items: center; justify-content: space-between; }
  .app-header-title { font-size: 18px; font-weight: 800; color: #fff; }
  .app-header-sub { font-size: 11px; color: #93c5fd; margin-top: 2px; }
  .signout-btn { background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px; padding: 7px 13px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }

  /* Tabs */
  .tab-bar { display: flex; background: #fff; border-bottom: 1.5px solid #e5e7eb; overflow-x: auto; }
  .tab-btn { flex-shrink: 0; padding: 14px 20px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; background: none; cursor: pointer; color: rgba(13,35,69,0.42); border-bottom: 2px solid transparent; margin-bottom: -1.5px; transition: color 0.15s; white-space: nowrap; }
  .tab-btn.active { color: #1e40af; border-bottom-color: #1e40af; font-weight: 700; }

  /* Content */
  .tab-content { display: none; padding: 24px 24px; max-width: 960px; margin: 0 auto; }
  .tab-content.active { display: block; }
  .section-title { font-size: 20px; font-weight: 800; color: #0d2345; margin-bottom: 4px; letter-spacing: -0.4px; }
  .section-sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }

  /* Cards */
  .card { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
  .card-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #9ca3af; margin-bottom: 12px; }
  .card-label.blue { color: #1e40af; }

  /* P&L rows */
  .pnl-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f3f4f6; }
  .pnl-row:last-child { border-bottom: none; }
  .pnl-label { font-size: 13px; color: #6b7280; }
  .pnl-val { font-size: 14px; font-weight: 700; color: #0d2345; }
  .pnl-row.total { border-top: 2px solid #e5e7eb; padding-top: 12px; margin-top: 4px; }
  .pnl-row.total .pnl-label { font-weight: 700; color: #0d2345; }
  .pnl-row.total .pnl-val { font-size: 18px; }

  /* Income / expense rows */
  .entry-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f3f4f6; gap: 12px; }
  .entry-row:last-child { border-bottom: none; }
  .entry-main { font-size: 13px; font-weight: 600; color: #0d2345; }
  .entry-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .entry-amount { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .cat-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; border-radius: 5px; padding: 2px 7px; display: inline-block; margin-bottom: 3px; }

  /* Tax */
  .tax-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .tax-row:last-child { border-bottom: none; }
  .tax-key { color: #6b7280; }
  .tax-val { font-weight: 600; color: #0d2345; }

  /* Year nav */
  .yr-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .yr-btn { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #e5e7eb; background: #fff; font-size: 16px; cursor: pointer; color: #374151; display: flex; align-items: center; justify-content: center; }
  .yr-label { font-size: 14px; font-weight: 700; color: #374151; background: #f3f4f6; border-radius: 8px; padding: 4px 12px; }

  /* Month nav */
  .mo-nav { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 0 18px; }
  .mo-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #e5e7eb; background: #fff; font-size: 18px; cursor: pointer; color: #374151; }
  .mo-label { font-size: 17px; font-weight: 700; color: #111; min-width: 160px; text-align: center; }

  .empty { color: #9ca3af; font-size: 13px; padding: 20px 0; text-align: center; }
  .total-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 4px; border-bottom: 2px solid #e5e7eb; margin-bottom: 4px; }
  .total-bar-label { font-size: 12px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧾 CR Revenue</div>
    <div class="login-sub">Sign in to view the financials</div>
    <label class="login-label">Email</label>
    <input type="email" id="login-email" class="login-input" placeholder="your@email.com" autocomplete="email">
    <label class="login-label">Password</label>
    <input type="password" id="login-pass" class="login-input" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="app-header">
    <div>
      <div class="app-header-title">🧾 CR Revenue</div>
      <div class="app-header-sub">Read-only financial view</div>
    </div>
    <button class="signout-btn" onclick="doSignOut()">Sign out</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('tab-overview',this)">Overview</button>
    <button class="tab-btn" onclick="showTab('tab-income',this);renderIncome()">Income</button>
    <button class="tab-btn" onclick="showTab('tab-expenses',this);renderExpenses()">Expenses</button>
    <button class="tab-btn" onclick="showTab('tab-tax',this);renderTax()">Tax</button>
  </div>

  <!-- Overview -->
  <div id="tab-overview" class="tab-content active">
    <div style="padding-top:4px;">
      <div class="section-title">P&L Summary</div>
      <div class="section-sub">Sole trader profit &amp; loss</div>
      <div class="yr-nav">
        <button class="yr-btn" onclick="changeYear(-1)">&#8249;</button>
        <span class="yr-label" id="yr-display">2025–26</span>
        <button class="yr-btn" onclick="changeYear(1)">&#8250;</button>
      </div>
      <div class="card">
        <div class="card-label">Income vs Expenses</div>
        <div id="pnl-body"></div>
      </div>
      <div class="card">
        <div class="card-label blue">Tax Estimate</div>
        <div id="tax-summary-body"></div>
      </div>
    </div>
  </div>

  <!-- Income -->
  <div id="tab-income" class="tab-content">
    <div class="section-title">Income</div>
    <div class="section-sub">All income entries</div>
    <div class="mo-nav">
      <button class="mo-btn" onclick="changeIncMonth(-1)">&#8249;</button>
      <span class="mo-label" id="inc-mo-label"></span>
      <button class="mo-btn" onclick="changeIncMonth(1)">&#8250;</button>
    </div>
    <div id="inc-list"></div>
  </div>

  <!-- Expenses -->
  <div id="tab-expenses" class="tab-content">
    <div class="section-title">Expenses</div>
    <div class="section-sub">All expense entries</div>
    <div class="mo-nav">
      <button class="mo-btn" onclick="changeExpMonth(-1)">&#8249;</button>
      <span class="mo-label" id="exp-mo-label"></span>
      <button class="mo-btn" onclick="changeExpMonth(1)">&#8250;</button>
    </div>
    <div id="exp-list"></div>
  </div>

  <!-- Tax -->
  <div id="tab-tax" class="tab-content">
    <div class="section-title">Tax Breakdown</div>
    <div class="section-sub">UK sole trader — income tax &amp; Class 4 NI</div>
    <div id="tax-body"></div>
  </div>
</div>

<script>
const SB_URL  = 'https://rxwmfssdvpilfvbpbrrq.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4d21mc3NkdnBpbGZ2YnBicnJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDY3NjQsImV4cCI6MjA5MTkyMjc2NH0.mG9jnkxhvcXonICd6BAkjCxNDiJJ_xfcJORQIaQuztw';
const sb = supabase.createClient(SB_URL, SB_ANON);

let incomeData   = [];
let expenseData  = [];
let taxYear      = new Date().getMonth() >= 3 ? new Date().getFullYear() : new Date().getFullYear() - 1;
let incYear = new Date().getFullYear(), incMon = new Date().getMonth();
let expYear = new Date().getFullYear(), expMon = new Date().getMonth();

const EXP_CATS = {
  software:      { label:'Software & Tools',   color:'#6366f1' },
  marketing:     { label:'Marketing & Ads',     color:'#ec4899' },
  equipment:     { label:'Equipment',           color:'#0ea5e9' },
  professional:  { label:'Professional Fees',   color:'#8b5cf6' },
  travel:        { label:'Travel & Transport',  color:'#f59e0b' },
  office:        { label:'Office & Supplies',   color:'#10b981' },
  subscriptions: { label:'Subscriptions',       color:'#14b8a6' },
  other:         { label:'Other',               color:'#6b7280' },
};

// Auth
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = error.message; return; }
  await loadAndShow();
}

async function doSignOut() {
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function loadAndShow() {
  const { data } = await sb.from('cr_shared').select('key, value');
  for (const row of (data || [])) {
    if (row.key === 'cr_income')   incomeData  = row.value || [];
    if (row.key === 'cr_expenses') expenseData = row.value || [];
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderOverview();
  renderIncomeNav();
  renderExpNav();
}

// Check existing session on load
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) loadAndShow();
});

// Tabs
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

// Year
function taxYearRange(y) {
  return { start:`${y}-04-06`, end:`${y+1}-04-05`, label:`${y}–${String(y+1).slice(2)}` };
}
function changeYear(d) { taxYear += d; renderOverview(); }

function taxCalc(profit) {
  const allowance = 12570, basicTop = 50270;
  if (profit <= allowance) return { incomeTax:0, ni:0, total:0 };
  const taxable   = profit - allowance;
  const basicBand = Math.min(taxable, basicTop - allowance);
  const highBand  = Math.max(0, taxable - (basicTop - allowance));
  const it  = basicBand * 0.20 + highBand * 0.40;
  const ni1 = Math.min(profit - allowance, basicTop - allowance);
  const ni2 = Math.max(0, profit - basicTop);
  const ni  = Math.max(0, ni1) * 0.09 + Math.max(0, ni2) * 0.02;
  return { incomeTax: Math.round(it), ni: Math.round(ni), total: Math.round(it + ni) };
}

function fmt(n) { return '£' + (n||0).toLocaleString('en-GB', {minimumFractionDigits:2}); }
function fmtDate(s) { if (!s) return ''; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }

function renderOverview() {
  const ty  = taxYearRange(taxYear);
  const inc = incomeData.filter(r => r.date >= ty.start && r.date <= ty.end);
  const exp = expenseData.filter(r => r.date >= ty.start && r.date <= ty.end);
  const totalInc = inc.reduce((s,r)=>s+(r.amount||0),0);
  const totalExp = exp.reduce((s,r)=>s+(r.amount||0),0);
  const profit   = totalInc - totalExp;
  const tax      = taxCalc(profit);
  const net      = profit - tax.total;
  const yrEl     = document.getElementById('yr-display');
  if (yrEl) yrEl.textContent = `Tax year ${ty.label}`;

  document.getElementById('pnl-body').innerHTML = `
    <div class="pnl-row"><span class="pnl-label">Total Income</span><span class="pnl-val" style="color:#059669;">${fmt(totalInc)}</span></div>
    <div class="pnl-row"><span class="pnl-label">Total Expenses</span><span class="pnl-val" style="color:#dc2626;">−${fmt(totalExp)}</span></div>
    <div class="pnl-row total"><span class="pnl-label">Gross Profit</span><span class="pnl-val" style="color:${profit>=0?'#0d2345':'#dc2626'};">${fmt(profit)}</span></div>
    <div class="pnl-row"><span class="pnl-label">Tax Estimate</span><span class="pnl-val" style="color:#d97706;">−£${tax.total.toLocaleString()}</span></div>
    <div class="pnl-row total"><span class="pnl-label">Net Profit (after tax)</span><span class="pnl-val" style="color:${net>=0?'#059669':'#dc2626'};">${fmt(net)}</span></div>`;

  const eff = profit > 0 ? Math.round(tax.total/profit*100) : 0;
  document.getElementById('tax-summary-body').innerHTML = `
    <div class="pnl-row"><span class="pnl-label">Income Tax</span><span class="pnl-val">£${tax.incomeTax.toLocaleString()}</span></div>
    <div class="pnl-row"><span class="pnl-label">Class 4 NI</span><span class="pnl-val">£${tax.ni.toLocaleString()}</span></div>
    <div class="pnl-row total"><span class="pnl-label">Total Tax Liability</span><span class="pnl-val" style="color:#d97706;">£${tax.total.toLocaleString()}</span></div>
    <div class="pnl-row"><span class="pnl-label">Effective Rate</span><span class="pnl-val">${eff}%</span></div>`;
}

// Income
function incMonthName() { return new Date(incYear, incMon, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function incMonthKey()  { return `${incYear}-${String(incMon+1).padStart(2,'0')}`; }
function changeIncMonth(d) {
  if (d<0) { incMon===0?(incMon=11,incYear--):incMon--; } else { incMon===11?(incMon=0,incYear++):incMon++; }
  renderIncome();
}
function renderIncomeNav() {
  const el = document.getElementById('inc-mo-label');
  if (el) el.textContent = incMonthName();
}
function renderIncome() {
  renderIncomeNav();
  const key  = incMonthKey();
  const rows = incomeData.filter(r=>r.date&&r.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = rows.reduce((s,r)=>s+(r.amount||0),0);
  const el = document.getElementById('inc-list');
  if (!el) return;
  if (!rows.length) { el.innerHTML=`<div class="empty">No income logged for ${incMonthName()}</div>`; return; }
  el.innerHTML = `<div class="total-bar"><span class="total-bar-label">Total</span><span style="font-size:16px;font-weight:800;color:#059669;">${fmt(total)}</span></div>` +
    rows.map(r=>`
      <div class="entry-row">
        <div><div class="entry-main">${r.source||'—'}</div><div class="entry-meta">${fmtDate(r.date)}${r.notes?' · '+r.notes:''}</div></div>
        <span class="entry-amount" style="color:#059669;">${fmt(r.amount)}</span>
      </div>`).join('');
}

// Expenses
function expMonthName() { return new Date(expYear, expMon, 1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function expMonthKey()  { return `${expYear}-${String(expMon+1).padStart(2,'0')}`; }
function changeExpMonth(d) {
  if (d<0) { expMon===0?(expMon=11,expYear--):expMon--; } else { expMon===11?(expMon=0,expYear++):expMon++; }
  renderExpenses();
}
function renderExpNav() {
  const el = document.getElementById('exp-mo-label');
  if (el) el.textContent = expMonthName();
}
function renderExpenses() {
  renderExpNav();
  const key  = expMonthKey();
  const rows = expenseData.filter(r=>r.date&&r.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = rows.reduce((s,r)=>s+(r.amount||0),0);
  const el = document.getElementById('exp-list');
  if (!el) return;
  if (!rows.length) { el.innerHTML=`<div class="empty">No expenses logged for ${expMonthName()}</div>`; return; }
  el.innerHTML = `<div class="total-bar"><span class="total-bar-label">Total</span><span style="font-size:16px;font-weight:800;color:#dc2626;">${fmt(total)}</span></div>` +
    rows.map(r=>{
      const cat = EXP_CATS[r.cat]||EXP_CATS.other;
      return `<div class="entry-row">
        <div>
          <span class="cat-pill" style="background:${cat.color};">${cat.label}</span>
          <div class="entry-main">${r.desc||'—'}</div>
          <div class="entry-meta">${fmtDate(r.date)}</div>
        </div>
        <span class="entry-amount" style="color:#dc2626;">${fmt(r.amount)}</span>
      </div>`;
    }).join('');
}

// Tax
function renderTax() {
  const ty  = taxYearRange(taxYear);
  const inc = incomeData.filter(r=>r.date>=ty.start&&r.date<=ty.end);
  const exp = expenseData.filter(r=>r.date>=ty.start&&r.date<=ty.end);
  const totalInc = inc.reduce((s,r)=>s+(r.amount||0),0);
  const totalExp = exp.reduce((s,r)=>s+(r.amount||0),0);
  const profit   = totalInc - totalExp;
  const tax      = taxCalc(profit);
  const taxable  = Math.max(0, profit - 12570);
  const eff      = profit>0?(tax.total/profit*100).toFixed(1):'0.0';
  const monthly  = profit>0?Math.round(tax.total/12):0;
  document.getElementById('tax-body').innerHTML = `
    <div class="card">
      <div class="card-label">Tax year ${ty.label} · ${ty.start} → ${ty.end}</div>
      <div class="tax-row"><span class="tax-key">Total Income</span><span class="tax-val">${fmt(totalInc)}</span></div>
      <div class="tax-row"><span class="tax-key">Allowable Expenses</span><span class="tax-val">${fmt(totalExp)}</span></div>
      <div class="tax-row" style="border-top:2px solid #e5e7eb;padding-top:10px;font-weight:700;"><span class="tax-key" style="color:#0d2345;">Taxable Profit</span><span class="tax-val" style="color:#0d2345;">${fmt(profit)}</span></div>
    </div>
    <div class="card">
      <div class="card-label blue">Income Tax Calculation</div>
      <div class="tax-row"><span class="tax-key">Personal Allowance</span><span class="tax-val">£12,570</span></div>
      <div class="tax-row"><span class="tax-key">Taxable after allowance</span><span class="tax-val">£${taxable.toLocaleString()}</span></div>
      <div class="tax-row"><span class="tax-key">Income Tax (20% / 40%)</span><span class="tax-val">£${tax.incomeTax.toLocaleString()}</span></div>
      <div class="tax-row"><span class="tax-key">Class 4 NI (9% / 2%)</span><span class="tax-val">£${tax.ni.toLocaleString()}</span></div>
      <div class="tax-row" style="border-top:2px solid #e5e7eb;padding-top:10px;"><span class="tax-key" style="font-weight:700;color:#0d2345;">Total Tax Liability</span><span class="tax-val" style="color:#d97706;font-size:16px;">£${tax.total.toLocaleString()}</span></div>
    </div>
    <div class="card" style="background:#eff6ff;border-color:#c7d2fe;">
      <div class="card-label" style="color:#1e40af;">What to set aside</div>
      <div class="tax-row"><span class="tax-key">Effective tax rate</span><span class="tax-val">${eff}%</span></div>
      <div class="tax-row"><span class="tax-key">Monthly set-aside</span><span class="tax-val" style="color:#1e40af;font-size:15px;">£${monthly.toLocaleString()}/mo</span></div>
      <div style="font-size:11px;color:#6b7280;margin-top:8px;line-height:1.5;">Based on 2025–26 rates. Verify with your accountant.</div>
    </div>`;
}
</script>
</body>
</html>
